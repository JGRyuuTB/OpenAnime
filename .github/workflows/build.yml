name: Compilar y publicar OpenAnime

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Compilar un solo exe
        run: pyinstaller --noconfirm --clean --onefile --windowed --name OpenAnime --collect-submodules yt_dlp main.py

      - name: Calcular hash
        shell: pwsh
        run: |
          (Get-FileHash dist/OpenAnime.exe -Algorithm SHA256).Hash | Out-File dist/OpenAnime.exe.sha256

      - name: Guardar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: OpenAnime-Windows
          path: |
            dist/OpenAnime.exe
            dist/OpenAnime.exe.sha256

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/OpenAnime.exe
            dist/OpenAnime.exe.sha256
          generate_release_notes: true

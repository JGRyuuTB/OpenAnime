name: Compilar y publicar OpenAnime

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Nueva versión (ejemplo: 1.2.0, sin la v)"
        required: true
        type: string
      release_notes:
        description: "Notas de la versión (opcional)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Determinar versión
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = $env:INPUT_VERSION.Trim()
            $tag = if ($version.StartsWith("v")) { $version } else { "v$version" }
          } else {
            $tag = "${{ github.ref_name }}"
            $version = $tag.Substring(1)
          }
          if ($version -notmatch '^\d+\.\d+\.\d+([\-+][0-9A-Za-z.-]+)?$') {
            throw "Versión no válida: $version. Usa formato 1.2.3"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "release_tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Aplicar versión al menú y al ejecutable
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $path = "main.py"
          $content = Get-Content $path -Raw
          $pattern = '(?m)^VERSION\s*=\s*["''].*?["'']\s*$'
          if ($content -notmatch $pattern) {
            throw "No se encontró la constante VERSION en main.py"
          }
          $replacement = 'VERSION = "' + $env:APP_VERSION + '"'
          $content = [regex]::Replace($content, $pattern, $replacement, 1)
          Set-Content -Path $path -Value $content -Encoding utf8

      - name: Verificar archivos necesarios
        shell: pwsh
        run: |
          foreach ($file in @("OpenAnime.ico", "installer.iss", "requirements.txt", "main.py")) {
            if (-not (Test-Path $file)) {
              throw "Falta el archivo requerido en la raíz del repositorio: $file"
            }
          }

      - name: Compilar EXE portátil con PyInstaller
        run: pyinstaller --noconfirm --clean --onefile --windowed --icon=OpenAnime.ico --name OpenAnime --collect-submodules yt_dlp main.py

      - name: Instalar Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            throw "No se encontró ISCC.exe después de instalar Inno Setup."
          }
          "ISCC_PATH=$iscc" >> $env:GITHUB_ENV

      - name: Crear instalador oscuro con el icono OpenAnime
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          & "$env:ISCC_PATH" "/DMyAppVersion=$env:APP_VERSION" "installer.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup terminó con código $LASTEXITCODE"
          }
          if (-not (Test-Path "installer-output/OpenAnime-Setup.exe")) {
            throw "No se generó installer-output/OpenAnime-Setup.exe"
          }

      - name: Calcular hashes SHA-256
        shell: pwsh
        run: |
          (Get-FileHash dist/OpenAnime.exe -Algorithm SHA256).Hash.ToLower() | Out-File -Encoding ascii dist/OpenAnime.exe.sha256
          (Get-FileHash installer-output/OpenAnime-Setup.exe -Algorithm SHA256).Hash.ToLower() | Out-File -Encoding ascii installer-output/OpenAnime-Setup.exe.sha256

      - name: Guardar artefactos
        uses: actions/upload-artifact@v4
        with:
          name: OpenAnime-Windows-${{ steps.version.outputs.version }}
          path: |
            dist/OpenAnime.exe
            dist/OpenAnime.exe.sha256
            installer-output/OpenAnime-Setup.exe
            installer-output/OpenAnime-Setup.exe.sha256

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          name: OpenAnime ${{ steps.version.outputs.version }}
          body: ${{ inputs.release_notes || '' }}
          files: |
            dist/OpenAnime.exe
            dist/OpenAnime.exe.sha256
            installer-output/OpenAnime-Setup.exe
            installer-output/OpenAnime-Setup.exe.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
